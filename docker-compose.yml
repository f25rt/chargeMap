services:
  mongo:
    image: mongo:7
    container_name: chargemap-mongo
    # Run as a single-node replica set so multi-document transactions work locally
    # (transactions require a replica set; Atlas clusters already are one).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - chargemap-mongo-data:/data/db
    healthcheck:
      # Initiate the replica set once, then report healthy. Idempotent: re-running
      # rs.initiate() after it's set just errors harmlessly.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chargemap-redis
    ports:
      - "6379:6379"
    volumes:
      - chargemap-redis-data:/data
    restart: unless-stopped

volumes:
  chargemap-mongo-data:
  chargemap-redis-data:
