spring:
  application:
    name: chargemap-api
  # Redis is OPTIONAL. It's only used for rate limiting; by default we exclude its
  # auto-configuration so the app never tries to connect to Redis (works on hosts with no
  # Redis, e.g. a free-tier deploy). To ENABLE Redis-backed rate limiting, set
  # CHARGEMAP_REDIS_EXCLUDE to an empty string AND set chargemap.rate-limit.enabled=true.
  autoconfigure:
    exclude: ${CHARGEMAP_REDIS_EXCLUDE:org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration}
  data:
    mongodb:
      # Local default targets the single-node replica set from docker-compose (replicaSet=rs0),
      # which is required for multi-document transactions. Atlas URIs are replica sets already.
      uri: ${MONGODB_URI:mongodb://localhost:27017/chargemap?replicaSet=rs0}
      # Indexes are created explicitly by MongoIndexConfig (single source of truth), so
      # annotation-based auto-index-creation is disabled to avoid duplicate/conflicting
      # index definitions (e.g. two text indexes on one collection).
      auto-index-creation: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Application-specific configuration (see specs/chargemap-backend-mvp/design.md)
chargemap:
  geo:
    default-radius-km: 5
    max-results: 50
  availability:
    staleness-minutes: 30
  pagination:
    default-size: 20
    max-size: 100
  # Rate limiting needs Redis; off by default. Enable only when Redis is available
  # (also clear CHARGEMAP_REDIS_EXCLUDE so the Redis auto-config is active).
  rate-limit:
    enabled: ${CHARGEMAP_RATE_LIMIT_ENABLED:false}
  security:
    jwt:
      # Base64-encoded HMAC secret. Override via env in every real environment.
      secret: ${JWT_SECRET:Y2hhbmdlLW1lLXRoaXMtaXMtYS1kZXYtb25seS1zZWNyZXQtMzIrYnl0ZXM=}
      expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}
  # OpenStreetMap importer (opt-in). When enabled, on startup the app fetches real
  # amenity=charging_station data (ODbL, attribute OpenStreetMap contributors) within the
  # bounding box and upserts it into the stations collection, then keeps running. Set
  # CHARGEMAP_IMPORT_OSM=true once to seed, then unset it for normal runs.
  #
  # Bounding boxes (S,W,N,E in decimal degrees):
  #   Philippines (default): 4.5, 116.0, 21.5, 127.0
  #   Metro Cebu (focused):  10.20, 123.75, 10.45, 124.05
  import:
    osm:
      enabled: ${CHARGEMAP_IMPORT_OSM:false}
      # Optional: import from a pre-fetched Overpass JSON file instead of calling the API.
      # Use this behind a TLS-inspecting proxy (e.g. Zscaler) that breaks the backend's
      # direct HTTPS to Overpass. Fetch with scripts/fetch-osm.ps1, then set this path.
      file: ${CHARGEMAP_IMPORT_OSM_FILE:}
      # Overpass endpoint. overpass-api.de uses a CA the JDK trusts out of the box.
      # Keep bounding boxes regional (not country-wide) or this endpoint may 504.
      endpoint: ${CHARGEMAP_IMPORT_OSM_ENDPOINT:https://overpass-api.de/api/interpreter}
      bbox:
        south: ${CHARGEMAP_IMPORT_OSM_SOUTH:4.5}
        west: ${CHARGEMAP_IMPORT_OSM_WEST:116.0}
        north: ${CHARGEMAP_IMPORT_OSM_NORTH:21.5}
        east: ${CHARGEMAP_IMPORT_OSM_EAST:127.0}
