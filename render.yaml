# Render Blueprint for ChargeMap. Deploy via Render Dashboard → "New +" → "Blueprint",
# point it at this repo, and Render provisions all three services from this file.
#
# Services:
#   - chargemap-api   : Spring Boot backend (Docker), internal + public URL
#   - chargemap-redis : managed Redis (Key Value) for rate limiting
#   - chargemap-web   : static SPA (Vite build) that rewrites /api -> the backend
#
# MongoDB is NOT provisioned here — use MongoDB Atlas and set MONGODB_URI (see notes below).

services:
  # ---- Backend (Docker web service) ----
  - type: web
    name: chargemap-api
    runtime: docker
    plan: starter            # 'free' spins down when idle; 'starter' stays warm
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      # Mongo Atlas connection string — set as a SECRET in the dashboard (sync:false).
      - key: MONGODB_URI
        sync: false
      # JWT signing secret — generate with: openssl rand -base64 48
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_MINUTES
        value: "1440"
      # AES-256 key for OAuth token / VIN encryption (Base64, 32 bytes). Set in dashboard.
      - key: CHARGEMAP_CRYPTO_KEY
        sync: false
      # Initial super-admin bootstrap (created once on first startup; nothing else is seeded).
      - key: CHARGEMAP_SUPERADMIN_EMAIL
        sync: false
      - key: CHARGEMAP_SUPERADMIN_PASSWORD
        sync: false
      # Redis connection, pulled from the managed instance below.
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: chargemap-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: chargemap-redis
          property: port

  # ---- Static frontend (Vite build) ----
  - type: web
    name: chargemap-web
    runtime: static
    plan: starter
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    envVars:
      # Mapbox publishable token (baked into the bundle at build). Set in dashboard.
      - key: VITE_MAPBOX_TOKEN
        sync: false
      # Same-origin: the rewrite below forwards /api to the backend, so leave this empty.
      - key: VITE_API_BASE_URL
        value: ""
    routes:
      # Proxy API + health to the backend service (keeps the app same-origin, no CORS).
      - type: rewrite
        source: /api/*
        destination: https://chargemap-api.onrender.com/api/*
      - type: rewrite
        source: /actuator/*
        destination: https://chargemap-api.onrender.com/actuator/*
      # SPA fallback: everything else serves index.html for client-side routing.
      - type: rewrite
        source: /*
        destination: /index.html

  # ---- Managed Redis (Render Key Value) ----
  - type: keyvalue
    name: chargemap-redis
    plan: starter
    ipAllowList: []          # empty = only accessible from Render services on this account

# MongoDB is external (MongoDB Atlas). After the first deploy, set MONGODB_URI on the
# chargemap-api service (Environment tab) to your Atlas SRV string with /chargemap, and
# add Render's outbound IPs (or 0.0.0.0/0 for testing) to Atlas Network Access.
